<section>
    <div class="flex justify-between align-middle">
        <h1>Home</h1>
        <div class="">
            <app-nav-bar></app-nav-bar>
        </div>
    </div>
    <h2 class="mb-4">Choose your theme</h2>
    <div class="mb-6 flex flex-wrap gap-3">
        <button
            class="min-w-[150px] btn {{ currentTheme === 'system' ? 'btn-primary' : 'btn-secondary' }}"
            (click)="handleThemeChange('system')"
        >
            <span class="icon-[carbon--screen] mr-2 text-2xl"></span>

            System
        </button>
        <button
            data-cy="theme-light-button"
            class="min-w-[150px] btn {{ currentTheme === 'light' ? 'btn-primary' : 'btn-secondary' }}"
            (click)="handleThemeChange('light')"
        >
            <span class="icon-[carbon--sun] mr-2 text-2xl"></span>

            Light
        </button>
        <button
            data-cy="theme-dark-button"
            class="min-w-[150px] btn {{ currentTheme === 'dark' ? 'btn-primary' : 'btn-secondary' }}"
            (click)="handleThemeChange('dark')"
        >
            <span class="icon-[carbon--moon] mr-2 text-2xl"></span>
            Dark
        </button>
    </div>

    <div class="mt-12">
        <h3 class="h5">Settings</h3>
        <ul>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/settings/accessibility'"
                >
                    Accessibility
                </a>
            </li>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/settings/account'"
                >
                    Account
                </a>
            </li>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/settings/appearance'"
                >
                    Appearance
                </a>
            </li>
        </ul>
    </div>

    <div class="mt-6">
        <h3 class="h5">Profiles</h3>
        <ul>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/users/maria'"
                    text-sm
                >
                    Maria
                </a>
            </li>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/users/pedro'"
                    text-sm
                >
                    Pedro
                </a>
            </li>
            <li>
                <a
                    class="link text-sm"
                    [routerLink]="'/users/sara'"
                    text-sm
                >
                    Sara
                </a>
            </li>
        </ul>
    </div>
</section>
