<!-- network info -->
<div class="flex gap-5">
  <div class="flex gap-3">
    <span class="text-sm text-blue-500" *ngIf="chainName && account"
      >Network: {{ chainName }}</span
    >
    <span *ngIf="!chainName && account">Network: Disconnected</span>
    <span *ngIf="account && !isSupportedNetwork" class="text-sm text-blue-500"
      >(Unsupported network)</span
    >

    <!-- If unsupported -->
    <button
      *ngIf="isSupportedNetwork"
      class="switch-btn"
      (click)="switchTo(11155111)"
    >
      Switch to Sepolia
    </button>
  </div>
  <!-- warning msg -->
  <div *ngIf="!isMetaMaskInstalled" class="text-sm text-red-500">
    MetaMask not found — please install it.
  </div>
  <!-- right side content -->
  <div class="right flex gap-3">
    <div *ngIf="account" class="wallet-info flex items-center gap-2">
      <span class="text-green-500">{{ account | formateAddress }}</span>

      <!-- ✅ Copy Button -->
      <button
        class="btn btn-outline-primary rounded px-2 text-xs"
        (click)="copyAddress()"
      >
        Copy
      </button>
      <button
        class="btn btn-outline-primary rounded px-2 text-xs"
        (click)="signMessage()"
      >
        Sign Message
      </button>
      <!-- ✅ Open Explorer -->
      <!-- <button
                class="btn btn-outline-info rounded px-2 text-xs"
                (click)="openInExplorer()"
            >
                Explorer
            </button> -->
      <span *ngIf="account && balance">
        {{ balance | number : "1.4-4" }} {{ nativeSymbol }}
      </span>
      <button
        class="btn btn-warning-500 ms ms-2 rounded-lg px-5 font-medium text-white transition"
        (click)="checkBalance()"
      >
        Check Token Balance
      </button>
      <button
        (click)="sendEth()"
        class="btn btn-warning-500 ms ms-2 rounded-lg px-5 font-medium text-white transition"
      >
        Send Sepollia Eth
      </button>
      <button
        class="btn btn-secondary ms ms-2 rounded-lg px-5 font-medium text-white transition"
        (click)="disConnectWallet()"
      >
        Disconnect
      </button>
    </div>
  </div>
</div>
